<!doctype html>
<html lang="zh-CN" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器人工作台 · WSMS</title>
<style>:root{font:14px/20px "PingFang TC","PingFang SC","Microsoft YaHei",sans-serif;color:#111817;background:#89c1af;--ink:#111817;--sub:#58625e;--soft:#58625e;--panel:#fff;--border:#e0e3e1;--field:#d1d7d3;--accent:#087647;--teal-soft:#e8f4ed;--photo:#f2f2f2;--warning:#a72e39;--display:"Alimama ShuHeiTi","阿里妈妈数黑体","PingFang TC",sans-serif}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1920px;padding:21px 15px 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #249d90;outline-offset:2px}
button{background:#fff;border:1px solid var(--field);border-radius:6px;padding:6px 12px}
button:not(:disabled):hover{border-color:#4da69f}
input,select{width:100%;min-width:0;height:34px;border:1px solid var(--field);border-radius:6px;background:#fff;padding:0 9px}
input::placeholder{color:var(--soft)}
[hidden]{display:none!important}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.danger{color:var(--warning)}
.masthead{height:59px;display:flex;position:relative;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;isolation:isolate;overflow:hidden;border-radius:32px;background:linear-gradient(100deg,#233748,#4d7464,#294e47);color:white}
.banner{width:min(412px,52%);height:100%;object-fit:cover;object-position:center;position:absolute;top:0;left:0;z-index:-1;border-radius:32px}
.brand,.operator{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand strong{font-size:20px;font-weight:700}
.operator{font-size:14px}
.operator span{opacity:.6;padding:0 5px}
[data-mode=day] .masthead{background:linear-gradient(100deg,#294e47,#4d7464,#294e47);color:white}
main{margin:16px auto 0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}
.queue-panel{min-height:calc(100dvh - 107px);display:flex;flex-direction:column;gap:12px}
.queue-panel.expanded-queue{min-height:calc(100dvh - 107px)}
.filters{display:grid;width:min(100%,1324px);grid-template-columns:minmax(0,185fr) minmax(0,170fr) minmax(0,114fr) minmax(0,124fr) minmax(0,191fr) minmax(0,202fr) minmax(0,266fr);gap:8px 12px;align-items:end;min-height:56px}
.filters label,.time-field>label,.range-panel label{color:var(--sub);font-size:12px;display:grid;gap:4px;font-weight:500}
.filters label input,.filters label select,.range-trigger{color:var(--ink);font-size:14px;font-weight:400}
.views{display:flex;align-items:center;height:56px;border:1px solid var(--field);border-radius:7px;padding:3px;gap:3px;background:#f2f2f2}
.views button{border:0;padding:0 4px;flex:1;background:none;font-size:14px;white-space:nowrap;color:var(--sub)}
.views [aria-pressed=true]{background:#0b6e65;color:#fff;font-weight:600;height:43px}
.search-field,.time-field{position:relative;min-width:0}
.search-field input{padding-right:28px}
.search-field .icon{position:absolute;right:10px;top:9px;pointer-events:none}
.icon{width:15px;height:15px;position:relative;display:inline-block;flex:none;color:var(--sub)}
.search-icon:before{content:"";position:absolute;width:8px;height:8px;left:1px;top:1px;border:1.4px solid currentColor;border-radius:50%}
.search-icon:after{content:"";position:absolute;width:5px;height:1.4px;left:9px;top:11px;transform:rotate(45deg);background:currentColor}
.calendar-icon:before{content:"";position:absolute;width:11px;height:10px;left:1px;top:3px;border:1.4px solid currentColor;border-radius:2px}
.calendar-icon:after{content:"";position:absolute;width:10px;border-top:1.4px solid currentColor;left:2px;top:6px}
.range-trigger{height:34px;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 9px;color:var(--sub);white-space:nowrap}
.range-trigger span:first-child{overflow:hidden;text-overflow:ellipsis}
.range-panel{position:fixed;margin:0;width:min(378px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 10px 35px #12384026}
.range-panel label{margin-top:9px}
.range-panel input{font-size:14px}
.range-panel p{color:var(--warning);margin:5px 0}
.range-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
.cards{display:flex;gap:21px;overflow-x:auto;min-height:148px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#8ebda9 transparent}
.task-card{width:309px;height:148px;flex:0 0 309px;position:relative;border:1px solid var(--border);border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:16px;color:var(--ink);min-width:0}
.task-card.selected{border-color:#108652;background:var(--teal-soft)}
.card-open{position:absolute;inset:0;border:0;border-radius:7px;background:transparent;padding:0;color:transparent;font-size:0}
.card-open:hover{box-shadow:inset 0 0 0 1px #5fb2a8}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-height:26px}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:3px 7px;line-height:18px;white-space:nowrap;font-size:12px;font-weight:500;background:var(--teal-soft);color:var(--accent)}
.platform[data-channel=美团]{background:#ead300;color:#000}
.platform[data-channel=淘宝]{background:#006fff;color:white}
.platform[data-channel=京东]{background:#b2273a;color:white}
.card-status{margin-left:auto}
.expired{background:#fff1cc;color:#704b08}
.denied{background:#fde6e6;color:#8d2833}
.accepted{background:#e3f1ee;color:#27685e}
.card-store{font-weight:600;font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-line{font-size:12px;color:var(--sub);line-height:18px;display:block;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.card-collapse{color:var(--accent);position:relative;z-index:1;align-self:center;font-size:14px;line-height:20px;font-family:inherit;font-weight:600;padding:0 5px;margin-top:auto;border:0;background:none}
.empty{padding:20px 4px;color:var(--sub);font-size:14px}
.detail{border-top:2px dashed #5d747b;padding-top:12px}
.detail-head{min-height:49px;display:flex;gap:12px;align-items:center;margin:0 0 12px;padding:0 4px}
.detail-identity{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.detail-identity h1{font:700 26px/34px var(--display);margin:0}
.rx{display:inline-grid;place-items:center;min-width:84px;height:37px;color:white;background:var(--warning);border-radius:24px;font:700 26px/34px var(--display)}
.product-meta{font-size:14px;color:var(--soft);margin-left:14px}
.rx[data-class="OTC"]{background:var(--accent)}
.big-timer{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--accent);background:var(--teal-soft);border-radius:8px;padding:4px 8px;font:700 32px/40px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.big-timer.urgent{color:#7b321f;background:#fbe7d7}
.evidence{display:grid;grid-template-columns:minmax(0,372fr) minmax(0,776fr) minmax(150px,172fr);max-width:1360px;gap:20px;align-items:end}
.product-pane{display:grid;gap:12px;min-width:0}
.photo{background:var(--photo);display:block;padding:0;border:0;overflow:hidden;border-radius:14px;width:100%}
.photo img{width:100%;height:100%;display:block;object-fit:cover}
.product-photo{aspect-ratio:1}
.scene-photo{aspect-ratio:776 / 437}
.scene-photo img{object-fit:cover}
.matching-photo{background:#e6e9e5}
.matching-photo img{object-fit:contain}
.thumbs{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{padding:0;overflow:hidden;width:min(52px,18%);aspect-ratio:1;border:1px solid #d6e1e1;border-radius:7px;background:#f6f8f8}
.thumb[aria-pressed=true]{border-color:#1d9687;box-shadow:0 0 0 1px #1d9687}
.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.actions{display:flex;flex-direction:column;gap:12px;min-width:0}
.actions h2{font-size:14px;line-height:20px;margin:0;overflow-wrap:anywhere}
.actions strong.location{color:var(--warning)}
.candidates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 3px}
.candidate{border:1px solid var(--field);padding:0;height:32px;font-size:14px;min-width:0}
.candidate[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.candidate:disabled{opacity:1;cursor:default}
.actions button.primary,.actions button.danger{width:100%;min-height:40px}
.chosen-order{font-size:12px;color:var(--sub);margin:0}
.result{color:var(--accent);font-size:14px;font-weight:700;margin:1px 0;text-align:center}
.result.expired-text{color:#7e540b}
.result.rejected-text{color:var(--warning)}
.scan-data{font-size:14px;line-height:1.5;display:grid;gap:10px}
.scan-data b{font-weight:700}
.scan-data .code{color:var(--warning);display:block;font-weight:650;overflow-wrap:anywhere}
.trace-block{background:#e3f1ef;padding:9px 10px;border-radius:7px;color:#47636a;font-size:12px;overflow-wrap:anywhere}
.history-meta{color:var(--sub);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--soft);font-size:12px;padding:13px 0 16px}
.tools button{font-size:12px;padding:4px 7px}
.tools [aria-pressed=true]{border-color:#5baca0;color:var(--accent);background:#ecf8f5}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#163a3b;color:white;border-radius:9px;padding:10px 15px;z-index:5;max-width:calc(100vw - 28px);box-shadow:0 5px 15px #05232330}
.toast[data-kind=error]{background:#7e2d38}
dialog{color:var(--ink);border:0;border-radius:13px;max-width:min(92vw,550px);padding:24px}
dialog h2{margin:0 0 10px}
dialog::backdrop{background:#0d202b82}
.modal-actions,.lightbox-top{display:flex;gap:9px;align-items:center;justify-content:flex-end;margin-top:16px}
.lightbox{max-width:94vw;max-height:93vh;width:min(1120px,94vw);padding:14px}
.lightbox-top{justify-content:space-between;margin:0 0 10px}
.lightbox img{width:100%;max-height:78vh;object-fit:contain;display:block}
[data-mode=day] body{padding-top:14px}
.brand strong{text-shadow:0 1px 4px #182821}
.trace-block{background:var(--teal-soft);color:var(--sub);padding:6px 16px}
.scan-data,.history-meta{font-size:12px;line-height:18px}
.range-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.range-inputs input{font-size:12px}
.month-nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:12px;margin:12px 0}
.month-nav button,.calendar button{border:0}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;align-items:center;gap:2px}
.calendar span{font-size:12px;color:var(--sub)}
.calendar button{padding:0;height:29px}
.calendar button[aria-pressed=true]{background:var(--accent);color:white}
.calendar button.in-range{background:var(--teal-soft)}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}
::picker(select){border:1px solid var(--field);border-radius:8px;padding:6px;background:white}
option{min-height:34px;padding:0 10px;border-radius:5px}
option:checked{background:var(--teal-soft);color:var(--accent)}
option::checkmark{display:none}
#store::picker(select){min-width:min(310px,90vw)}}
@media(max-width:1180px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters .views{max-width:220px}
.evidence{grid-template-columns:minmax(180px,27fr) minmax(0,56fr) minmax(145px,17fr);gap:11px}
.detail-identity h1{font-size:22px}
.product-meta{margin-left:0}
.candidates{gap:6px}
.actions h2{font-size:15px}
.actions{gap:8px}
.queue-panel{min-height:calc(100dvh - 107px)}
.big-timer{font-size:28px}}
@media(max-width:760px){body{padding:8px 8px 0}
.masthead{padding:0 12px;height:58px}
.brand strong{font-size:15px}
.operator{font-size:10px;gap:4px}
.operator span{padding:0}
main{margin-top:8px}
.panel{padding:12px}
.filters{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px}
.views{grid-column:1/-1;width:210px}
.task-card{width:260px;flex-basis:260px}
.detail-head{gap:5px;flex-wrap:wrap}
.detail-identity h1{font-size:18px}
.rx{font-size:16px;padding:3px 12px}
.product-meta{font-size:11px}
.big-timer{font-size:19px;padding:3px 9px}
.evidence{grid-template-columns:minmax(85px,1fr) minmax(0,2.2fr)}
.actions{grid-column:1/-1}
.candidates{grid-template-columns:repeat(8,minmax(0,1fr))}
.detail{min-height:0}
.queue-panel.expanded-queue{min-height:70vh}}
.cards.card-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,309px));
  justify-content:start;
  align-content:start;
  gap:12px 21px;
  min-height:0;
  max-height:max(180px,calc(100dvh - 222px));
  overflow:hidden auto;
  overscroll-behavior:contain;
}
.card-grid .task-card{width:100%;min-width:0}
@media(max-width:1180px){
  .cards.card-grid{grid-template-columns:repeat(3,minmax(0,309px));max-height:max(180px,calc(100dvh - 280px))}
}
@media(max-width:760px){
  .cards.card-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:max(180px,calc(100dvh - 330px))}
}
@media(max-width:480px){.cards.card-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="masthead">
  <img id="banner" class="banner" alt="">
  <div class="brand"><strong id="heading">夜间模式</strong></div>
  <div class="operator">全部穹彻门店 <span>·</span> 远程主控</div>
</header>
<main>
  <section id="queue-panel" class="panel queue-panel" aria-label="任务队列">
    <form id="filters" class="filters" role="search">
      <div class="views" aria-label="任务视图"><button type="button" id="current-view" aria-pressed="true">待处理任务</button><button type="button" id="all-history" aria-pressed="false">历史日志</button></div>
      <label>门店名称<select id="store"><option value="">全部门店</option></select></label>
      <label>销售平台<select id="platform"><option value="">全部平台</option><option>美团</option><option>京东</option><option>淘宝</option></select></label>
      <label>任务类型<select id="type"><option value="">全部类型</option><option value="pick">分拣指认</option><option value="review">复核决策</option></select></label>
      <label>平台单号 / 流水号<span class="search-field"><input id="order" type="search" placeholder="输入完整单号或流水号"><span class="icon search-icon" aria-hidden="true"></span></span></label>
      <label>商品信息<span class="search-field"><input id="product" type="search" placeholder="品名 / 准字 / 条码"><span class="icon search-icon" aria-hidden="true"></span></span></label>
      <div class="time-field"><label for="range">发生时间范围</label><button type="button" id="range" class="range-trigger" popovertarget="range-panel"><span>开始时间 → 结束时间</span><span class="icon calendar-icon" aria-hidden="true"></span></button>
      <div id="range-panel" class="range-panel" popover>
        <strong>选择发生时间范围</strong>
        <div class="range-inputs"><label>开始<input id="range-start" type="datetime-local"></label>
        <label>结束<input id="range-end" type="datetime-local"></label></div>
        <div class="month-nav"><button type="button" id="prev-month" aria-label="上个月">‹</button><strong id="month-label"></strong><button type="button" id="next-month" aria-label="下个月">›</button></div>
        <div id="calendar" class="calendar"></div>
        <p id="range-error" role="status"></p>
        <div class="range-actions"><button type="button" id="clear-range">清空</button><button type="button" id="cancel-range">取消</button><button type="button" class="primary" id="apply-range">确定</button></div>
      </div></div>
    </form>
    <div id="cards" class="cards" tabindex="0" aria-label="横向任务列表"></div>
    <div id="queue-empty" class="empty" hidden></div>
    <section id="detail" class="detail" aria-label="任务详情" hidden></section>
  </section>
  <footer class="tools">
    <strong>演示工具</strong>
    <button data-mode="night">夜间模式</button><button data-mode="day">白天模式</button>
    <button id="arrive">模拟新任务</button><button id="replay">模拟通知重发</button><button id="expire">模拟超时</button><button id="other">模拟他人已处理</button><button id="reset">重新体验</button>
  </footer>
</main>
<div id="feedback" role="status" class="toast" hidden></div>
<dialog id="confirm">
  <h2>确认拒绝本件？</h2>
  <p id="confirm-item"></p><p>整单将停止拣选，机器人回收已拣商品。</p>
  <div class="modal-actions"><button id="cancel-reject">返回</button><button id="confirm-reject" class="primary">确认拒绝</button></div>
</dialog>

    if (list.classList.contains('card-grid')) state.gridOffset = list.scrollTop;
    else state.railOffset = list.scrollLeft;
  }
  const rows = visibleRows();
  if (state.selected && !rows.some(row => row.id === state.selected)) state.selected = null;
  if (!state.selected && !state.collapsed) state.selected = rows[0]?.id ?? null;
  const showGrid = !state.selected;
  document.documentElement.dataset.mode = state.mode;
  $('heading').textContent = state.mode === 'night' ? '夜间模式' : '白日模式';
  const banner = state.mode === 'night' ? assets.nightBanner : assets.dayBanner;
  if ($('banner').getAttribute('src') !== banner) $('banner').src = banner;
  $('current-view').textContent = state.mode === 'night' ? '待处理任务' : '昨夜已处理';
  $('current-view').setAttribute('aria-pressed', state.view === 'current');
  $('all-history').setAttribute('aria-pressed', state.view === 'all');
  document.querySelectorAll('.tools [data-mode]').forEach(button => button.setAttribute('aria-pressed', button.dataset.mode === state.mode));
  $('queue-panel').classList.toggle('expanded-queue', showGrid);
  $('queue-empty').hidden = rows.length > 0;
  $('queue-empty').textContent = '当前没有符合条件的任务';
  list.hidden = !rows.length;
  list.classList.toggle('card-grid', showGrid);
  list.setAttribute('aria-label', showGrid ? '纵向任务列表' : '横向任务列表');
  list.innerHTML = rows.map(card).join('');
  list.scrollLeft = showGrid ? 0 : state.railOffset;
  list.scrollTop = showGrid ? state.gridOffset : 0;
  const active = reveal && list.querySelector('.selected');
  if (active) {
    const card = active.getBoundingClientRect();
    const rail = list.getBoundingClientRect();
    if (card.left < rail.left) list.scrollLeft += card.left - rail.left;
    if (card.right > rail.right) list.scrollLeft += card.right - rail.right;
  }
  for (const id of ['expire', 'other', 'replay']) $(id).disabled = !isLive(getTask());
  $('arrive').disabled = state.mode !== 'night' || state.view !== 'current';
  renderDetail();
}
function timer(row) {
  return `<span class="big-timer timer" data-deadline="${row.deadline}">◴ ${remaining(row.deadline)}</span>`;
}
function photo(label, src, role, css) {
  return `<button type="button" class="photo ${css}" data-photo="${role}" aria-label="放大${label}"><img src="${src}" alt="${label}"></button>`;
}
function gallery(row) {
  const index = state.photos.get(row.id) ?? 0;
  return `<div class="product-pane">${photo(photoLabels[index], productImages[index], 'main', 'product-photo')}
    <div class="thumbs" aria-label="商品图片">${productImages.slice(1).map((s, i) =>
    `<button type="button" class="thumb" data-thumb="${i + 1}" aria-pressed="${index === i + 1}" aria-label="${photoLabels[i + 1]}"><img src="${s}" alt=""></button>`).join('')}</div></div>`;
}
function result(row) {
  if (isLive(row)) return '';
  if (row.status === 'timeout') return '<p class="result expired-text">超时人工未操作</p>';
  if (row.status === 'reject') return '<p class="result rejected-text">' + (row.kind === 'pick' ? '人工仍未发现有货' : '不可以出给顾客') + '</p>';
  if (row.status === 'other') return '<p class="result">已由其他主控处理</p>';
  return '<p class="result">' + (row.kind === 'pick' ? '指认了' + chosen(row).join('、') + '号' : '可以出给顾客') + '</p>';
}
function decisionPane(row) {
  const live = isLive(row);
  if (row.kind === 'pick') {
    const nums = chosen(row);
    return `<h2>请在<strong class="location">${row.slot}</strong>货位指认药品，可多选</h2>
      <div class="candidates" aria-label="候选序号">${numberOptions.map(n => `<button type="button" class="candidate" data-seq="${n}" aria-pressed="${nums.includes(n)}" ${live ? '' : 'disabled'}>${n}</button>`).join('')}</div>
      ${live ? `<p id="chosen-order" class="chosen-order" ${nums.length ? '' : 'hidden'}>${nums.length ? '尝试顺序 ' + nums.join(' → ') : ''}</p>
      <button id="submit" type="button" class="primary">提交指认</button><button id="deny" type="button" class="danger">人工仍未发现有货</button>` : result(row)}`;
  }
  const recognized = row.mismatch
    ? [row.otherName, row.otherApproval, row.otherMaker] : [row.name + ' ' + row.spec, row.approval, row.maker];
  return `<h2>你认为右图实物是否可以出给顾客</h2><p class="chosen-order">${row.slot || "未提供"} · 第 ${row.box} 盒</p><div class="scan-data">
    <b>实物码信息如下：</b>
    <div>条码：<span class="code">${row.scanned ?? row.barcode}</span></div>
    <div>追溯码：<span class="code">${row.trace || '未提供'}</span></div>
    <div class="trace-block">追溯码所带出的信息为：<br>${recognized.join('<br>')}</div></div>
    ${live ? '<button id="submit" type="button" class="primary">可以出给顾客</button><button id="deny" type="button" class="danger">不可以出给顾客</button>' : result(row)}`;
}
function renderDetail() {
  const el = $('detail');
  const row = getTask();
  el.hidden = !row;
  if (!row) { el.replaceChildren(); return; }
  const live = isLive(row);
  const branch = row.kind === 'pick' ? ['货架实拍图', assets.shelf] : ['实物对照图', row.mismatch ? assets.mismatch : assets.actual];
  el.innerHTML = `<header class="detail-head">
    <div class="detail-identity"><span class="rx" data-class="${row.medicineClass ?? 'RX'}">${row.medicineClass ?? 'RX'}</span><h1>[${row.sku}] ${row.name} ${row.spec}</h1>
    <span class="product-meta">${row.barcode || '未提供'} / ${row.maker} / ${row.approval}</span></div>
    ${live ? timer(row) : ''}</header>
    <div class="evidence">${gallery(row)}${photo(branch[0], branch[1], 'scene', row.kind === 'review' && !row.mismatch ? 'scene-photo matching-photo' : 'scene-photo')}
    <div class="actions">${decisionPane(row)}
      ${live ? '' : `<div class="history-meta">${row.id} · ${row.slot || '未提供'} 第 ${row.box} 盒<br>${row.handledBy} · ${datetime.format(row.handledAt)}</div>`}
    </div></div>`;
}
function switchView(view, mode = state.mode) {
  state.mode = mode;
  state.view = view;
  state.selected = null;
  state.collapsed = false;
  state.railOffset = 0;
  state.gridOffset = 0;
  notification('');
  render({ resetScroll: true });
}
function finish(row, status, by = '当前主控') {
  if (row.status !== 'pending') return;
  row.status = status;
  row.handledBy = by;
  row.handledAt = Date.now();
  if (status === 'accepted' && row.kind === 'pick') row.picked = [...chosen(row)];
  state.drafts.delete(row.id);
  const next = ['accepted', 'other'].includes(status) && row.nextId && story.find(x => x.id === row.nextId);
  if (next) ingest(next);
  if (state.selected === row.id && state.mode === 'night' && state.view === 'current') {
    state.selected = next?.id ?? null;
    state.collapsed = false;
    if ($('confirm').open && rejectId === row.id) $('confirm').close();
  }
}
function submit(row, status) {
  if (!isLive(row)) return;
  if (Date.now() >= row.deadline) {
    finish(row, 'timeout', '系统');
    notification('任务已超时，已记入历史日志。', 'error');
  } else {
    finish(row, status);
    notification(status === 'reject' ? '已提交拒绝' : '已提交，等待机器人执行结果');
  }
  render({ reveal: true });
}
function tick() {
  const expired = [...state.tasks.values()].filter(row => row.status === 'pending' && Date.now() >= row.deadline);
  if (expired.length) {
    const currentExpired = expired.some(row => row.id === state.selected);
    expired.forEach(row => finish(row, 'timeout', '系统'));
    if (currentExpired && state.mode === 'night' && state.view === 'current') notification('任务已超时，已记入历史日志。', 'error');
    render();
  }
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const deadline = Number(el.dataset.deadline);
    el.textContent = '◴ ' + remaining(deadline);
    if (el.matches('.big-timer')) el.classList.toggle('urgent', deadline - Date.now() <= 30_000);
  });
}

$('store').add(new Option(fixture.store, fixture.store));
$('filters').onsubmit = event => event.preventDefault();
for (const name of ['platform', 'store', 'type']) $(name).onchange = () => render();
for (const name of ['order', 'product']) $(name).oninput = () => render();
$('current-view').onclick = () => switchView('current');
$('all-history').onclick = () => switchView('all');
document.querySelectorAll('.tools [data-mode]').forEach(button => {
  button.onclick = () => { switchView('current', button.dataset.mode); window.scrollTo(0, 0); };
});
$('range-panel').addEventListener('beforetoggle', event => {
  if (event.newState !== 'open') return;
  const b = $('range').getBoundingClientRect();
  const w = Math.min(378, innerWidth - 20);
  $('range-panel').style.left = Math.max(10, Math.min(b.left, innerWidth - w - 10)) + 'px';
  $('range-panel').style.top = Math.max(10, Math.min(b.bottom + 5, innerHeight - 450)) + 'px';
  $('range-start').value = state.range.startText ?? '';
  $('range-end').value = state.range.endText ?? '';
  $('range-error').textContent = '';
  calendarField = 'range-start';
  monthCursor = new Date(state.range.start ?? Date.now());
  drawCalendar();
});
let monthCursor = new Date();
let calendarField = 'range-start';
function drawCalendar() {
  const year = monthCursor.getFullYear(), month = monthCursor.getMonth();
  $('month-label').textContent = year + ' 年 ' + (month + 1) + ' 月';
  const cell = document.createDocumentFragment();
  for (const weekday of '一二三四五六日') {
    const label = document.createElement('span');
    label.textContent = weekday;
    cell.append(label);
  }
  const offset = (new Date(year, month, 1).getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) cell.append(document.createElement('span'));
  const first = $('range-start').value.slice(0, 10), last = $('range-end').value.slice(0, 10);
  for (let day = 1; day <= new Date(year, month + 1, 0).getDate(); day++) {
    const date = [year, String(month + 1).padStart(2, '0'), String(day).padStart(2, '0')].join('-');
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.date = date;
    button.textContent = day;
    button.setAttribute('aria-label', date);
    button.setAttribute('aria-pressed', date === first || date === last);
    if (first && last && date > first && date < last) button.className = 'in-range';
    cell.append(button);
  }
  $('calendar').replaceChildren(cell);
}
for (const field of ['range-start', 'range-end']) {
  $(field).onfocus = () => { calendarField = field; };
  $(field).oninput = () => {
    if ($(field).value) monthCursor = new Date($(field).value);
    drawCalendar();
  };
}
function moveMonth(offset) {
  monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + offset, 1);
  drawCalendar();
}
$('prev-month').onclick = () => moveMonth(-1);
$('next-month').onclick = () => moveMonth(1);
$('calendar').onclick = event => {
  const date = event.target.closest('[data-date]')?.dataset.date;
  if (!date) return;
  const field = $(calendarField);
  field.value = date + 'T' + (field.value.slice(11) || (calendarField === 'range-start' ? '00:00' : '23:59'));
  calendarField = calendarField === 'range-start' ? 'range-end' : 'range-start';
  drawCalendar();
};
function applyRange(clear = false) {
  const startText = clear ? '' : $('range-start').value;
  const endText = clear ? '' : $('range-end').value;
  const start = startText ? new Date(startText).getTime() : null;
  const end = endText ? new Date(endText).getTime() : null;
  if (start !== null && end !== null && start > end) { $('range-error').textContent = '结束时间须晚于或等于开始时间。'; return; }
  state.range = { start, end, startText, endText };
  $('range').firstElementChild.textContent = startText || endText
    ? (startText.replace('T', ' ') || '不限') + ' → ' + (endText.replace('T', ' ') || '不限')
    : '开始时间 → 结束时间';
  $('range').title = $('range').firstElementChild.textContent;
  $('range-panel').hidePopover();
  render();
}
$('clear-range').onclick = () => applyRange(true);
$('cancel-range').onclick = () => $('range-panel').hidePopover();
$('apply-range').onclick = () => applyRange();
$('cards').onclick = event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.id === 'collapse') {
    state.selected = null; state.collapsed = true;
  } else if (button.dataset.select) {
    state.selected = button.dataset.select; state.collapsed = false;
  }
  notification('');
  render({ reveal: Boolean(button.dataset.select) });
  if (button.dataset.select) $('cards').querySelector(`[data-select="${button.dataset.select}"]`)?.focus({ preventScroll: true });
  else if (button.id === 'collapse') $('cards').focus({ preventScroll: true });
};
$('detail').onclick = event => {
  const button = event.target.closest('button');
  const row = getTask();
  if (!button || !row) return;
  if (button.dataset.thumb) {
    const index = Number(button.dataset.thumb);
    const next = state.photos.get(row.id) === index ? 0 : index;
    state.photos.set(row.id, next);
    const image = $('detail').querySelector('[data-photo=main] img');
    image.src = productImages[next];
    image.alt = photoLabels[next];
    image.parentElement.setAttribute('aria-label', '放大' + photoLabels[next]);
    $('detail').querySelectorAll('[data-thumb]').forEach(thumb => thumb.setAttribute('aria-pressed', Number(thumb.dataset.thumb) === next));
    return;
  }
  if (button.dataset.photo) {
    const image = button.querySelector('img');
    $('large-photo').src = image.src;
    $('large-photo').alt = image.alt;
    $('lightbox-label').textContent = image.alt;
    $('lightbox').showModal();
    return;
  }
  if (!isLive(row)) return;
  if (button.dataset.seq) {
    const seq = Number(button.dataset.seq);
    const current = chosen(row);
    const next = current.includes(seq) ? current.filter(x => x !== seq) : [...current, seq];
    state.drafts.set(row.id, next);
    button.setAttribute('aria-pressed', next.includes(seq));
    $('chosen-order').hidden = !next.length;
    $('chosen-order').textContent = '尝试顺序 ' + next.join(' → ');
  } else if (button.id === 'submit') {
    if (row.kind === 'pick' && !chosen(row).length) { notification('请先选择至少一个候选序号。', 'error'); return; }
    submit(row, 'accepted');
  } else if (button.id === 'deny') {
    rejectId = row.id;
    $('confirm-item').textContent = row.channel + '#' + row.serial + ' · ' + row.name;
    $('confirm').showModal();
  }
};
$('cancel-reject').onclick = () => $('confirm').close();
$('confirm-reject').onclick = () => {
  $('confirm').close();
  submit(state.tasks.get(rejectId), 'reject');
};
$('close-lightbox').onclick = () => $('lightbox').close();
$('expire').onclick = () => {
  const row = getTask();
  if (isLive(row)) { row.deadline = Date.now(); tick(); }
};
$('other').onclick = () => {
  const row = getTask();
  if (isLive(row)) { finish(row, 'other', '其他主控'); notification('该任务已被处理'); render({ reveal: true }); }
};
$('replay').onclick = () => {
  const row = getTask();
  if (isLive(row) && !ingest(row, row.requestedAt)) notification('收到重复通知，仍为原任务。');
};
$('arrive').onclick = () => {
  const seq = ++state.nextMock;
  if (ingest({ id: 'TASK-NEW-' + seq, channel: '京东', serial: String(200 + seq), order: String(2631190000020000 + seq), kind: 'pick', slot: 'C02-01-01-01' })) {
    notification('收到一条新任务');
    render();
  }
};
$('reset').onclick = () => {
  $('range').firstElementChild.textContent = '开始时间 → 结束时间';
  $('range').removeAttribute('title');
  reset();
};
reset();
setInterval(tick, 250);

</script>

  { id: 'TASK-801-03', kind: '复核决策', slot: 'A-01-02', box: 2, trace: '81234567890123456782' },
  { id: 'TASK-801-04', kind: '复核决策', slot: 'B-04-01', box: 1, trace: '81234567890123456783' }
];
const localTime = ms => new Date(ms).toLocaleTimeString('zh-CN', { hour12: false });
const localDay = ms => new Date(ms).toLocaleDateString('sv-SE');
let queue, historyRows, selected, tab, rejectId, nextIndex, choices;

function ingest(event, requestedAt = Date.now()) {
  if ([...queue, ...historyRows].some(row => row.id === event.id)) return;
  queue.push({ ...base, ...event, requestedAt, deadline: requestedAt + waitMs });
  selected ??= event.id;
}

function reset() {
  by('modal').close();
  queue = [];
  selected = null;
  choices = [];
  historyRows = [{
    ...base, ...sequence[0], order: 'DEMO-790', id: 'TASK-790-01',
    requestedAt: Date.now() - 86_400_000, previous: true,
    result: '指认 1 号 · 已受理', who: '示例主控'
  }];
  nextIndex = 1;
  ingest(sequence[0]);
  tab = 'live';
  note('');
  render();
}

const task = () => queue.find(row => row.id === selected);
function note(message) { by('feedback').textContent = message; }

function images(row) {
  if (row.trace) {
    return `<div class="compare">
      <figure>实物图（模拟）<img alt="实物样例" src="${actual}"></figure>
      <figure>美团商品图（模拟）<img alt="商品样例" src="${product}"></figure>
    </div>`;
  }
  return `<img class="shelf" alt="带候选序号的模拟货架图" src="${shelf}">`;
}

function details(row) {
  return `<div class="head"><span class="pill ${row.trace ? 'scan' : ''}">${row.kind}</span><b>${row.store}</b></div>
    <h2>${row.name} <small>${row.spec}</small></h2>
    <div class="meta"><span>${row.platform} #${row.serial}</span><span>订单 ${row.order}</span>
    <span>货位 ${row.slot} · 第 ${row.box} 盒</span><span>订单条码 ${row.bar}</span>
    ${row.trace ? `<span>溯源码 ${row.trace}</span>` : ''}</div>`;
}

function pointer(row) {
  return `<div class="task-window"><span>任务 ${row.id}</span>
    <span>截止 ${localTime(row.deadline)}</span><strong id="remaining"></strong></div>`;
}

function render() {
  by('live').textContent = '待处理　' + queue.length;
  for (const key of ['live', 'past']) by(key).className = key === tab ? 'on' : '';
  for (const key of ['expire', 'other', 'replay']) by(key).disabled = tab !== 'live' || !task();
  if (tab === 'past') {
    showHistory();
    return;
  }
  const current = task();
  const rows = queue.map(row => `<button class="row ${row.id === selected ? 'on' : ''}" data-id="${row.id}">
    <span class="pill ${row.trace ? 'scan' : ''}">${row.kind}</span><strong>${row.name}</strong>
    <small>${row.store} · ${row.platform} #${row.serial}</small><small>${row.slot} · 第 ${row.box} 盒</small>
    </button>`).join('');
  by('page').innerHTML = `<div class="board"><aside><h3>待处理任务</h3>${rows}</aside>
    <article>${current ? details(current) + pointer(current) + images(current) + controls(current) :
    '<div class="empty">当前没有待处理任务</div>'}</article></div>`;
  by('page').querySelectorAll('[data-id]').forEach(button => {
    button.onclick = () => {
      if (button.dataset.id !== selected) choices = [];
      selected = button.dataset.id;
      note('');
      render();
    };
  });
  if (current) bindControls(current);
  tick();
}

function controls(row) {
  const candidates = row.candidates?.map(seq =>
    `<button class="candidate" data-seq="${seq}" type="button" aria-pressed="false">${seq}</button>`).join('');
  return `${candidates ? `<section class="picker"><b>选择候选序号</b>
    <div class="candidates">${candidates}</div><small id="choice-summary"></small></section>` : ''}
    <div class="actions"><button id="submit" class="primary">${row.trace ? '可以出给顾客' : '提交指认'}</button>
    <button id="deny" class="warn">${row.trace ? '不能出给顾客' : '人工仍未发现有货'}</button></div>`;
}

function bindControls(row) {
  function syncChoices() {
    by('page').querySelectorAll('[data-seq]').forEach(button => {
      button.setAttribute('aria-pressed', choices.includes(Number(button.dataset.seq)));
    });
    by('choice-summary').textContent = choices.length
      ? '尝试顺序　' + choices.join(' → ')
      : '可多选，机器人按选择顺序尝试';
  }
  if (row.candidates) {
    by('page').querySelectorAll('[data-seq]').forEach(button => {
      button.onclick = () => {
        const seq = Number(button.dataset.seq);
        choices = choices.includes(seq) ? choices.filter(value => value !== seq) : [...choices, seq];
        syncChoices();
      };
    });
    syncChoices();
  }
  by('submit').onclick = () => {
    if (row.candidates && !choices.length) { note('请选择至少一个候选序号。'); return; }
    resolveTask(row.id, row.trace ? '允许继续 · 已受理' : '指认 ' + choices.join(' → ') + ' 号 · 已受理', true);
  };
  by('deny').onclick = () => {
    rejectId = row.id;
    by('message').innerHTML = `<h3>确认拒绝本件？</h3><p>${row.store} · ${row.order} · ${row.name}</p>
      <p>机器人将停止整单拣选并自主回收，剩余商品停止处理。</p>`;
    by('affirm').hidden = false;
    by('modal').showModal();
  };
}

function resolveTask(id, result, continues, who = '当前主控') {
  const row = queue.find(item => item.id === id);
  if (!row) return;
  if (Date.now() >= row.deadline) {
    finish(row, '超时人工未操作', false, '系统');
  } else {
    finish(row, result, continues, who);
  }
}

function finish(row, result, continues, who) {
  if (by('modal').open && !by('affirm').hidden && rejectId === row.id) by('modal').close();
  historyRows.unshift({ ...row, result, who });
  queue = queue.filter(item => item.id !== row.id);
  if (selected === row.id) {
    selected = queue[0]?.id;
    choices = [];
  }
  if (continues && nextIndex < sequence.length) ingest(sequence[nextIndex++]);
  note(row.id + '　' + result);
  render();
}

function tick() {
  const expired = queue.find(row => Date.now() >= row.deadline);
  if (expired) {
    finish(expired, '超时人工未操作', false, '系统');
    return;
  }
  const row = task();
  const clock = by('remaining');
  if (!row || !clock) return;
  const remaining = Math.ceil((row.deadline - Date.now()) / 1000);
  const two = value => String(value).padStart(2, '0');
  clock.textContent = `剩余 ${two(Math.floor(remaining / 60))}:${two(remaining % 60)}`;
  clock.classList.toggle('warn', remaining <= 30);
}

function showHistory() {
  by('page').innerHTML = `<section class="history"><h2>历史转人工</h2><div class="filters">
    <select id="period" aria-label="日期范围"><option>昨夜（夜间无人模式）</option><option>全部日期</option><option>指定日期</option></select>
    <input id="date" hidden type="date" aria-label="日期"><select id="field" aria-label="筛选字段">
    ${Object.entries({order:'订单号', platform:'平台', serial:'流水号', name:'商品名称', bar:'条码', slot:'货位编码', store:'门店', id:'任务 ID'})
      .map(([key, name]) => `<option value="${key}">${name}</option>`).join('')}</select>
    <input id="query" placeholder="输入筛选内容"></div><div id="rows"></div></section>`;
  function filter() {
    const period = by('period').selectedIndex;
    by('date').hidden = period !== 2;
    const rows = historyRows.filter(row =>
      (period === 1 || (period === 0 ? row.previous : localDay(row.requestedAt) === by('date').value)) &&
      row[by('field').value].includes(by('query').value.trim()));
    by('rows').innerHTML = rows.length ? `<table>
      <tr><th>请求时间</th><th>任务 / 异常</th><th>订单号</th><th>货位 / 盒</th><th>处理结果</th><th></th></tr>
      ${rows.map(row => `<tr><td>${localDay(row.requestedAt)} ${localTime(row.requestedAt)}</td>
        <td>${row.id}<br><small>${row.kind}</small></td><td>${row.order}</td><td>${row.slot} · 第 ${row.box} 盒</td>
        <td>${row.result}</td><td><button data-view="${row.id}">查看</button></td></tr>`).join('')}</table>`
      : '<div class="empty">没有符合条件的记录</div>';
    by('rows').querySelectorAll('[data-view]').forEach(button => {
      button.onclick = () => {
        const row = rows.find(item => item.id === button.dataset.view);
        by('message').innerHTML = details(row) + images(row) + `<p>${row.id} · ${row.result} · ${row.who}</p>`;
        by('affirm').hidden = true;
        by('modal').showModal();
      };
    });
  }
  for (const key of ['period', 'date', 'field', 'query']) by(key).oninput = filter;
  filter();
}

by('close').onclick = () => by('modal').close();
by('affirm').onclick = () => {
  by('modal').close();
  resolveTask(rejectId, '拒绝 · 已受理', false);
};
by('reset').onclick = reset;
by('expire').onclick = () => {
  const row = task();
  if (!row) return;
  row.deadline = Date.now();
  tick();
};
by('other').onclick = () => {
  const row = task();
  if (row) resolveTask(row.id, '已由其他主控处理', true, '其他主控');
};
by('replay').onclick = () => {
  const row = task();
  if (!row) return;
  ingest(row, row.requestedAt);
  note('收到重复通知，仍为任务 ' + row.id);
  tick();
};
for (const key of ['live', 'past']) {
  by(key).onclick = () => { tab = key; note(''); render(); };
}
reset();
setInterval(tick, 250);
</script></html>
